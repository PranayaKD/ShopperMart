components:
  schemas:
    AddToCart:
      type: object
      description: Input serializer for adding items to cart (UUID Hardened).
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
      required:
      - product_id
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - item_count
      - items
      - total_price
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
        product_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        product_image:
          type: string
          nullable: true
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - product
      - product_image
      - product_name
      - product_price
      - product_slug
      - subtotal
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        product_count:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - id
      - name
      - product_count
      - slug
      - url
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
          description: Optional SimpleJWT refresh token to blacklist.
    OrderCreate:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 50
        postal_code:
          type: string
          maxLength: 6
          minLength: 6
        landmark:
          type: string
          maxLength: 255
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          default: upi
      required:
      - address
      - city
      - email
      - full_name
      - postal_code
      - state
    OrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        payment:
          type: string
          maxLength: 50
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        status_logs:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusLog'
          readOnly: true
        lifecycle_progress:
          type: integer
          readOnly: true
        lifecycle_percentage:
          type: integer
          readOnly: true
        lifecycle_steps:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - address
      - city
      - created_at
      - email
      - full_name
      - id
      - items
      - lifecycle_percentage
      - lifecycle_progress
      - lifecycle_steps
      - payment
      - postal_code
      - status_logs
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total:
          type: string
          readOnly: true
      required:
      - id
      - price
      - product_name
      - quantity
      - total
    OrderList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        item_count:
          type: integer
          readOnly: true
        lifecycle_percentage:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - full_name
      - id
      - item_count
      - lifecycle_percentage
      - total
    OrderStatusLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        old_status:
          type: string
          maxLength: 20
        new_status:
          type: string
          maxLength: 20
        changed_by_username:
          type: string
          readOnly: true
        note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by_username
      - created_at
      - id
      - new_status
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedOrderListList:
      type: object
