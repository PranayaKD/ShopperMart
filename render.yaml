services:
  - type: web
    name: shoppermart
    env: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn ShopperMart.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --worker-class gthread --timeout 60"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shoppermart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
databases:
  - name: shoppermart-db
    databaseName: shoppermart
    user: shopperuser
